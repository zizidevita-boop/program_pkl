  const M=rows.map((r,i)=>{const u=U.find(x=>x.nama==r[0]),ly=LY[r[1]],d=ago(r[2]),ok=['diproses','selesai','diverifikasi'].includes(r[3]);
    return{id:i+1,no:'SIPAK-'+d.replace(/-/g,'')+'-'+String(i+101).padStart(6,'0'),uid:u.id,nama:u.nama,hp:u.hp,alamat:'Jl. Melati No. '+(i+3)+', Kecamatan',lid:ly.id,tgl:d,selesai:r[3]=='selesai'?ago(Math.max(r[2]-ly.hari,0)):'',status:r[3],catatan:r[3]=='perlu_perbaikan'?'Mohon unggah ulang dokumen KK yang kurang jelas.':r[3]=='ditolak'?'Berkas tidak sesuai persyaratan.':'',petugas:r[3]=='diajukan'?0:2,

function toast(m,t='ok'){const e=document.createElement('div');e.className=`rounded-xl border-l-4 ${t=='ok'?'border-green-500':'border-red-500'} bg-white px-4 py-3 text-sm shadow-lg`;e.textContent=m;$('#toast').append(e);setTimeout(()=>e.remove(),4000)}

function notif(uid,mid,judul,pesan,j='info'){D.N.unshift({uid,mid,judul,pesan,t:now(),baca:0,j})}
function stat(id,to,cat=''){const m=MO(id);
  if(!NEXT[m.status].includes(to))return toast('Perubahan status tidak diizinkan.','er');
  if(to=='diverifikasi'&&!m.docs.every(d=>d.st=='valid'))return toast('Semua dokumen harus Valid dulu.','er');
  if(to=='ditolak'&&cat.trim().length<5)return toast('Alasan penolakan wajib diisi (min. 5 karakter).','er');
  m.status=to;m.catatan=cat;if(!m.petugas)m.petugas=V.me.id;if(to=='selesai')m.selesai=iso(T);
  m.riw.push({st:to,cat,t:now(),by:'Petugas'});
  const tx={diproses:['Permohonan sedang diproses','Permohonan '+m.no+' sedang dalam proses pelayanan.','info'],selesai:['Permohonan selesai','Permohonan '+m.no+' telah selesai. Silakan datang ke kantor kecamatan.','sukses'],ditolak:['Permohonan ditolak','Permohonan '+m.no+' ditolak. Alasan: '+cat,'gagal']}[to];
  if(tx)notif(m.uid,m.id,...tx);save();toast('Status diubah menjadi '+ST[to][0]+'.');R()}
function verif(id,i,ok){const m=MO(id),d=m.docs[i];
  if(ok){d.st='valid';d.cat=''}else{const c=(prompt('Alasan perbaikan (wajib):')||'').trim();if(c.length<3)return toast('Alasan wajib diisi.','er');d.st='perlu_perbaikan';d.cat=c;
    if(NEXT[m.status].includes('ditolak')&&m.status!='perlu_perbaikan'){m.status='perlu_perbaikan';m.catatan='Dokumen "'+d.n+'": '+c;m.riw.push({st:'perlu_perbaikan',cat:m.catatan,t:now(),by:'Petugas'});notif(m.uid,m.id,'Dokumen perlu diperbaiki','Mohon perbaiki dokumen '+d.n+': '+c,'peringatan')}}
  if(!m.petugas)m.petugas=V.me.id;save();R()}
function reup(id,i,inp){const m=MO(id);if(!inp.files[0])return toast('Pilih file perbaikan dulu.','er');
  m.docs[i]={...m.docs[i],file:inp.files[0].name,st:'menunggu',cat:''};
  if(!m.docs.some(d=>d.st=='perlu_perbaikan')){m.status='diajukan';m.catatan='';m.riw.push({st:'diajukan',cat:'Dokumen perbaikan diunggah ulang oleh pemohon.',t:now(),by:'Pemohon'})}
  save();toast('Dokumen perbaikan terkirim.');R()}

  <div class="fixed inset-0 z-30 hidden bg-slate-900/50 lg:hidden" id="ov" onclick="sb(0)"></div>
  <main class="min-h-screen lg:ml-64 ${w?'pb-16 md:pb-0':''}">
  <header class="sticky top-0 z-20 flex items-center gap-3 bg-[#0b3b8c] px-4 py-3 text-white md:bg-white md:text-slate-900 md:border-b">
    <button class="text-xl lg:hidden" onclick="sb(1)" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <div class="flex flex-1 items-center gap-2 font-extrabold md:hidden">${logo('h-7 w-6')}SIPAK</div>
    <div class="hidden flex-1 md:block"><h1 class="text-lg font-bold leading-tight">${title}</h1><p class="text-xs text-slate-500">${sub}</p></div>
    <div class="flex items-center gap-2"><span class="grid h-9 w-9 place-items-center rounded-full bg-white text-sm font-bold text-[#0b3b8c] md:bg-[#0b3b8c] md:text-white">${esc(me.nama.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div class="hidden text-sm leading-tight sm:block"><b>${esc(me.nama)}</b><div class="text-xs capitalize text-slate-500">${me.role=='admin'?'Administrator':me.role}</div></div></div></header>
  <div class="p-4 md:p-6"><div class="mb-4 md:hidden"><h1 class="text-xl font-bold">${title}</h1><p class="text-xs text-slate-500">${sub}</p></div>${body}
  <p class="mt-8 text-center text-xs text-slate-400">Demo SIPAK · data tersimpan di browser Anda · bukan sistem resmi</p></div></main>
  ${w?`<nav class="bt fixed inset-x-0 bottom-0 z-30 flex border-t bg-white py-1 text-[11px] text-slate-500 md:hidden">${[['dash','house','Beranda'],['daftar','file-lines','Permohonan'],['notif','bell','Notifikasi'],['ajukan','file-circle-plus','Ajukan']].map(x=>`<a onclick="go('${x[0]}')" class="flex flex-1 flex-col items-center gap-0.5 py-1 ${V.pg==x[0]?'font-bold text-[#0b3b8c]':''}"><i class="fa-solid fa-${x[1]} text-lg"></i>${x[2]}</a>`).join('')}</nav>`:''}`}
function sb(o){$('#sb').classList.toggle('-translate-x-full',!o);$('#ov').classList.toggle('hidden',!o)}

  <svg viewBox="0 0 800 300" class="absolute inset-x-0 bottom-0 w-full opacity-80" preserveAspectRatio="xMidYMax slice"><path d="M110 120 400 40l290 80z" fill="#7fa6e6" opacity=".45"/><g fill="#7fa6e6" opacity=".4"><rect x="130" y="120" width="540" height="20"/><rect x="150" y="146" width="26" height="110"/><rect x="214" y="146" width="26" height="110"/><rect x="278" y="146" width="26" height="110"/><rect x="342" y="146" width="26" height="110"/><rect x="432" y="146" width="26" height="110"/><rect x="496" y="146" width="26" height="110"/><rect x="560" y="146" width="26" height="110"/><rect x="624" y="146" width="26" height="110"/><rect x="100" y="256" width="600" height="14"/><rect x="80" y="270" width="640" height="30"/><rect x="0" y="190" width="110" height="110"/><rect x="690" y="190" width="110" height="110"/></g><path d="M0 270c120-40 240 30 400-6s300-40 400 0v40H0z" fill="#fff" opacity=".1"/></svg></section>

  <div class="my-3 flex justify-between text-sm"><label><input type="checkbox"> Ingat saya</label><a href="#" class="text-blue-600" onclick="alert('Demo: hubungi admin untuk mengatur ulang password.');return false">Lupa password?</a></div>

function doLogin(e){e.preventDefault();const u=D.U.find(x=>x.email==em.value.trim().toLowerCase());
  if(!u||pw.value!='demo123')return toast('Email atau password salah.','er'),false;
  if(!u.aktif)return toast('Akun Anda dinonaktifkan.','er'),false;
  V.me=u;V.pg='dash';R();return false}

/* ---------- Komponen ---------- */
const card=(l,v,ic,c)=>{const t={b:['#eef5ff','#d7e5fb','#1d5fd6'],o:['#fff1e6','#fcd2b0','#ea580c'],g:['#e9f8ee','#c3ebcf','#16a34a'],r:['#fdecec','#f8c9c9','#dc2626']}[c||'b'];
  return`<div class="flex items-center gap-3 rounded-xl border p-4" style="background:${t[0]};border-color:${t[1]}"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-lg text-white" style="background:${t[2]}"><i class="fa-solid fa-${ic}"></i></span><div><div class="text-xs text-slate-600">${l}</div><div class="text-2xl font-extrabold leading-tight">${v}</div></div></div>`};
const cnt=(l,s)=>l.filter(m=>[].concat(s).includes(m.status)).length;
function rows(list){return list.length?list.map(m=>`<tr class="cursor-pointer hover:bg-slate-50" onclick="go('detail',${m.id})"><td class="whitespace-nowrap font-semibold">${m.no}</td><td>${esc(m.nama)}</td><td>${esc(LY(m.lid).n)}</td><td>${dmy(m.tgl)}</td><td>${bd(m.status)}</td><td><button class="rounded-md border px-3 py-1 text-xs font-semibold">Detail</button></td></tr>`).join(''):`<tr><td colspan="6" class="py-10 text-center text-slate-400"><i class="fa-regular fa-folder-open mb-2 block text-3xl"></i>Belum ada data yang cocok.</td></tr>`}
const table=(l)=>`<div class="overflow-x-auto"><table class="w-full min-w-[620px]"><thead><tr><th>No. Permohonan</th><th>Nama Pemohon</th><th>Jenis Layanan</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows(l)}</tbody></table></div>`;
function pager(n,per=6){const pages=Math.max(1,Math.ceil(n/per));V.p=Math.min(V.p,pages);return`<div class="mt-4 flex justify-center gap-1 text-sm">${Array.from({length:pages},(_,i)=>`<button class="h-8 min-w-8 rounded-md border px-2 ${V.p==i+1?'bg-[#0b3b8c] text-white':'bg-white'}" onclick="V.p=${i+1};R()">${i+1}</button>`).join('')}</div>`}
const byNew=(a,b)=>b.tgl.localeCompare(a.tgl)||b.id-a.id;
const mine=()=>V.me.role=='masyarakat'?D.M.filter(m=>m.uid==V.me.id):D.M;

/* ---------- Dashboard ---------- */
function dash(){const me=V.me,L=mine();
  if(me.role=='masyarakat'){const my=[...L].sort(byNew).slice(0,5);return shell('Beranda','Selamat datang di SIPAK',`<div class="mb-4 rounded-xl bg-gradient-to-r from-[#0b3b8c] to-[#082d6b] p-5 text-white"><h2 class="text-xl font-bold">Halo, ${esc(me.nama)}</h2><p class="mb-3 text-sm text-blue-100">Ajukan dan pantau permohonan layanan Anda.</p><button class="rounded-lg bg-white px-4 py-2 text-sm font-semibold text-[#0b3b8c]" onclick="go('ajukan')"><i class="fa-solid fa-file-circle-plus"></i> Ajukan Permohonan</button></div>
  <div class="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4">${card('Permohonan Saya',L.length,'file-lines')}${card('Diproses',cnt(L,['diajukan','diverifikasi','diproses']),'gears','o')}${card('Perlu Perbaikan',cnt(L,'perlu_perbaikan'),'pen-to-square','o')}${card('Selesai',cnt(L,'selesai'),'circle-check','g')}</div>
  <div class="${CARD}"><h3 class="mb-3 font-bold">Permohonan Terbaru</h3>${my.length?my.map(m=>`<a class="flex gap-3 border-b py-3 last:border-0" onclick="go('detail',${m.id})"><span class="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full" style="background:${ST[m.status][2]}"></span><div><b class="text-sm">${m.no}</b><div class="text-sm text-slate-600">${esc(LY(m.lid).n)}</div>${bd(m.status)}</div></a>`).join(''):'<p class="py-6 text-center text-slate-400">Belum ada permohonan.</p>'}</div>`)}
  const per=Array(12).fill(0);L.forEach(m=>{if(m.tgl.slice(0,4)==T.getFullYear())per[+m.tgl.slice(5,7)-1]++});const mx=Math.max(4,Math.ceil(Math.max(...per)/4)*4);
  const ps=Object.keys(ST).map(k=>[k,cnt(L,k)]);let a=0;const cg=L.length?ps.filter(x=>x[1]).map(x=>{const s=a;a+=x[1]/L.length*100;return`${ST[x[0]][2]} ${s}% ${a}%`}).join(','):'#e2e8f0 0 100%';
  const cards=me.role=='admin'?`${card('Total Pengguna',D.U.length,'users')}${card('Masyarakat',D.U.filter(u=>u.role=='masyarakat').length,'user-group')}${card('Petugas',D.U.filter(u=>u.role=='petugas'&&u.aktif).length,'user-tie')}${card('Total Permohonan',L.length,'file-lines')}${card('Menunggu Verifikasi',cnt(L,'diajukan'),'hourglass-half','o')}${card('Diproses',cnt(L,['diverifikasi','diproses']),'gears')}${card('Selesai',cnt(L,'selesai'),'circle-check','g')}${card('Ditolak',cnt(L,'ditolak'),'circle-xmark','r')}`
   :`${card('Baru Hari Ini',L.filter(m=>m.tgl==iso(T)).length,'inbox')}${card('Menunggu Verifikasi',cnt(L,'diajukan'),'hourglass-half','o')}${card('Perlu Perbaikan',cnt(L,'perlu_perbaikan'),'pen-to-square','o')}${card('Diproses',cnt(L,['diverifikasi','diproses']),'gears')}${card('Selesai',cnt(L,'selesai'),'circle-check','g')}${card('Tugas Saya',L.filter(m=>m.petugas==me.id&&!['selesai','ditolak'].includes(m.status)).length,'user-check')}`;
  const q=L.filter(m=>['diajukan','diverifikasi','diproses'].includes(m.status)).sort((a,b)=>a.tgl<b.tgl?-1:1).slice(0,6);
  return shell(me.role=='admin'?'Dashboard Admin':'Dashboard Pelayanan','Selamat datang, '+esc(me.nama),`<div class="mb-4 grid grid-cols-2 gap-3 xl:grid-cols-4">${cards}</div>
  ${me.role=='admin'?`<div class="mb-4 grid gap-4 lg:grid-cols-[2fr_1fr]"><div class="${CARD}"><h3 class="mb-3 font-bold">Grafik Permohonan per Bulan (${T.getFullYear()})</h3><div class="flex gap-2"><div class="flex h-40 flex-col-reverse justify-between text-[10px] text-slate-500">${[0,1,2,3,4].map(i=>`<span>${i*mx/4}</span>`).join('')}</div><div class="flex-1"><div class="flex h-40 items-end gap-1 border-b" style="background:repeating-linear-gradient(to top,transparent 0,transparent calc(25% - 1px),#e2e8f0 calc(25% - 1px),#e2e8f0 25%)">${per.map((n,i)=>`<div class="flex h-full flex-1 items-end justify-center"><div class="w-full max-w-5 rounded-t bg-[#1d5fd6]" style="height:${n/mx*100}%" title="${n}"></div></div>`).join('')}</div><div class="mt-1 flex gap-1 text-[10px] text-slate-500">${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'].map(x=>`<span class="flex-1 text-center">${x}</span>`).join('')}</div></div></div></div>
  <div class="${CARD}"><div class="mb-3 flex justify-between"><h3 class="font-bold">Status Permohonan</h3><a class="cursor-pointer text-xs text-blue-600" onclick="go('daftar')">Lihat Semua</a></div><div class="flex flex-wrap items-center gap-4"><div class="relative h-32 w-32 shrink-0 rounded-full" style="background:conic-gradient(${cg})"><div class="absolute inset-[22px] grid place-content-center rounded-full bg-white text-center leading-tight"><b class="text-2xl">${L.length}</b><span class="text-[11px] text-slate-500">Total</span></div></div><ul class="min-w-36 flex-1 space-y-1 text-sm">${ps.map(x=>`<li class="flex items-center gap-2"><i class="h-2.5 w-2.5 rounded-sm" style="background:${ST[x[0]][2]}"></i>${ST[x[0]][0]}<b class="ml-auto">${x[1]}</b></li>`).join('')}</ul></div></div></div>`:''}
  <div class="${CARD}"><div class="mb-3 flex justify-between"><h3 class="font-bold">${me.role=='admin'?'Permohonan Terbaru':'Antrean Permohonan'}</h3><a class="cursor-pointer text-xs text-blue-600" onclick="go('daftar')">Lihat Semua</a></div>${table(me.role=='admin'?[...L].sort(byNew).slice(0,6):q)}</div>`)}

/* ---------- Daftar & detail ---------- */
function daftar(){const w=V.me.role=='masyarakat',L=mine().filter(m=>(!V.q||(m.no+m.nama).toLowerCase().includes(V.q.toLowerCase()))&&(!V.fs||m.status==V.fs)&&(!V.fl||m.lid==V.fl)).sort(byNew);
  return shell(w?'Riwayat Permohonan':'Daftar Permohonan',w?'Pantau status seluruh permohonan Anda':'Kelola dan proses permohonan masyarakat',`<div class="${CARD}"><div class="mb-3 flex flex-wrap gap-2"><input class="in min-w-52 flex-[3]" placeholder="Cari nomor permohonan / nama pemohon..." value="${esc(V.q)}" onchange="V.q=this.value;V.p=1;R()">
  <select class="in flex-1" onchange="V.fl=this.value;V.p=1;R()"><option value="">Semua Layanan</option>${D.LY.map(l=>`<option value="${l.id}" ${V.fl==l.id?'selected':''}>${esc(l.n)}</option>`).join('')}</select>
  <select class="in flex-1" onchange="V.fs=this.value;V.p=1;R()"><option value="">Semua Status</option>${Object.keys(ST).map(k=>`<option value="${k}" ${V.fs==k?'selected':''}>${ST[k][0]}</option>`).join('')}</select></div>${table(L.slice((V.p-1)*6,V.p*6))}${pager(L.length)}</div>`)}
function detail(){const m=MO(V.id),me=V.me,w=me.role=='masyarakat',ly=LY(m.lid);
  if(!m||(w&&m.uid!=me.id))return shell('Tidak ditemukan','',`<div class="${CARD} text-center">Data tidak ditemukan. <a class="text-blue-600" onclick="go('daftar')">Kembali</a></div>`);
  if(w)D.N.forEach(n=>{if(n.uid==me.id&&n.mid==m.id)n.baca=1});
  const can=!w&&(me.role=='admin'||!m.petugas||m.petugas==me.id);
  const docs=m.docs.map((d,i)=>`<tr><td>${esc(d.n)}</td><td>${esc(d.file)}</td><td>${d.st=='valid'?'<span class="bd bg-green-100 text-green-700">Valid</span>':d.st=='menunggu'?'<span class="bd bg-amber-100 text-amber-700">Menunggu</span>':'<span class="bd bg-orange-100 text-orange-700">Perlu Perbaikan</span>'}${d.cat?`<div class="text-xs text-slate-500">${esc(d.cat)}</div>`:''}</td><td class="whitespace-nowrap">
   ${can&&['diajukan','diverifikasi','perlu_perbaikan'].includes(m.status)?`<button class="rounded bg-green-600 px-2 py-1 text-xs text-white" onclick="verif(${m.id},${i},1)">Valid</button> <button class="rounded bg-orange-500 px-2 py-1 text-xs text-white" onclick="verif(${m.id},${i},0)">Perbaikan</button>`:''}
   ${w&&m.status=='perlu_perbaikan'&&d.st=='perlu_perbaikan'?`<input type="file" id="f${i}" class="max-w-40 text-xs"><button class="rounded bg-[#0b3b8c] px-2 py-1 text-xs text-white" onclick="reup(${m.id},${i},f${i})">Kirim</button>`:''}</td></tr>`).join('');
  const act=can?NEXT[m.status].map(s=>`<button class="rounded-lg ${AKSI[s][1]} px-4 py-2 text-sm font-semibold text-white" onclick="stat(${m.id},'${s}',${s=='ditolak'?"prompt('Alasan penolakan (wajib):')||''":"prompt('Catatan untuk pemohon (opsional):')||''"})">${AKSI[s][0]}</button>`).join(' '):'';
  return shell('Detail Permohonan','Permohonan &gt; Detail',`<div class="grid gap-4 lg:grid-cols-[2fr_1fr]"><div class="space-y-4">
  <div class="${CARD} flex items-start gap-3"><span class="grid h-10 w-10 place-items-center rounded-lg bg-blue-100 text-[#1d5fd6]"><i class="fa-solid fa-file-lines"></i></span><div class="flex-1"><b>${m.no}</b><div class="text-sm text-slate-500">${esc(ly.n)}</div><div class="text-xs text-slate-400">Diajukan pada ${dmy(m.tgl)}</div></div>${bd(m.status)}</div>
  <div class="${CARD}"><h3 class="mb-2 font-bold">Informasi Pemohon</h3><dl class="grid grid-cols-[110px_1fr] gap-1 text-sm"><dt class="text-slate-500">Nama</dt><dd>${esc(m.nama)}</dd><dt class="text-slate-500">No. Telepon</dt><dd>${esc(m.hp)}</dd><dt class="text-slate-500">Alamat</dt><dd>${esc(m.alamat)}</dd>${m.selesai?`<dt class="text-slate-500">Selesai</dt><dd>${dmy(m.selesai)}</dd>`:''}<dt class="text-slate-500">Petugas</dt><dd>${m.petugas?esc(UN(m.petugas)):'Belum ditugaskan'}</dd></dl></div>
  <div class="${CARD}"><h3 class="mb-2 font-bold">Dokumen</h3><div class="overflow-x-auto"><table class="w-full min-w-[480px]"><thead><tr><th>Jenis Dokumen</th><th>Nama File</th><th>Status</th><th></th></tr></thead><tbody>${docs}</tbody></table></div></div>
  ${act?`<div class="${CARD}"><h3 class="mb-2 font-bold">Tindakan Layanan</h3><div class="flex flex-wrap gap-2">${act}</div>${NEXT[m.status].includes('diverifikasi')&&!m.docs.every(d=>d.st=='valid')?'<p class="mt-2 text-xs text-slate-500">Verifikasi tersedia setelah semua dokumen Valid.</p>':''}</div>`:''}</div>
  <div class="space-y-4"><div class="${CARD}"><h3 class="mb-3 font-bold">Timeline Status</h3><ul class="space-y-3 border-l-2 border-slate-200 pl-4">${[...m.riw].reverse().map((r,i)=>`<li class="relative"><span class="absolute -left-[22px] top-1 h-3 w-3 rounded-full border-2 border-white ${i?'bg-slate-300':'bg-[#1d5fd6]'}"></span><b class="text-sm">${ST[r.st][0]}</b><div class="text-xs text-slate-500">${dmy(r.t.slice(0,10))} ${r.t.slice(11)} · ${r.by}</div>${r.cat?`<div class="mt-1 rounded bg-slate-50 p-2 text-xs">${esc(r.cat)}</div>`:''}</li>`).join('')}</ul></div>
  ${m.catatan?`<div class="rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm"><b>Catatan Petugas</b><p>${esc(m.catatan)}</p></div>`:''}</div></div>`)}

/* ---------- Ajukan (wizard 4 langkah) ---------- */
function ajukan(){const s=V.step,d=V.d,ly=LY(d.lid),st=['Layanan|Pilih jenis','Formulir|Isi data','Dokumen|Unggah berkas','Konfirmasi|Periksa & kirim'];
  const head=`<div class="mb-4 flex items-start gap-2">${st.map((x,i)=>`${i?'<span class="mt-3.5 h-0.5 flex-1 bg-slate-200"></span>':''}<div class="flex gap-2 text-sm"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-full border-2 ${i+1<=s?'border-[#1d5fd6] bg-[#1d5fd6] text-white':'border-slate-300 bg-white text-slate-500'} font-bold">${i+1}</span><div class="hidden leading-tight sm:block ${i+1==s?'font-semibold':''}">${x.split('|')[0]}<div class="text-[11px] font-normal text-slate-500">${x.split('|')[1]}</div></div></div>`).join('')}</div>`;
  let b='';
  if(s==1)b=`<div class="${CARD}"><h3 class="mb-3 font-bold">1. Pilih Jenis Layanan</h3><select class="in" onchange="V.d.lid=+this.value||0;R()"><option value="">-- Pilih layanan --</option>${D.LY.filter(l=>l.aktif).map(l=>`<option value="${l.id}" ${d.lid==l.id?'selected':''}>${esc(l.n)}</option>`).join('')}</select></div>${ly?`<div class="mt-3 rounded-xl border border-blue-200 bg-blue-50 p-4 text-sm"><b><i class="fa-solid fa-circle-info"></i> Persyaratan Layanan</b> <span class="text-xs text-slate-500">· estimasi ${ly.hari} hari kerja</span><ul class="mt-2 list-disc pl-5">${ly.req.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:''}`;
  if(s==2)b=`<div class="${CARD} space-y-3"><h3 class="font-bold">2. Data Pemohon</h3><div><label class="text-sm font-semibold">Nama Lengkap *</label><input id="a1" class="in mt-1" value="${esc(d.nama??V.me.nama)}"></div><div><label class="text-sm font-semibold">Nomor Telepon *</label><input id="a2" class="in mt-1" value="${esc(d.hp??V.me.hp)}"></div><div><label class="text-sm font-semibold">Alamat *</label><textarea id="a3" rows="3" class="in mt-1" placeholder="Jl. Melati No. 12, Kecamatan">${esc(d.alamat||'')}</textarea></div></div>`;
  if(s==3)b=`<div class="${CARD}"><h3 class="mb-1 font-bold">3. Unggah Dokumen</h3><p class="mb-3 text-xs text-slate-500">PDF, JPG, atau PNG. (Demo: hanya nama file yang disimpan.)</p>${ly.req.map((r,i)=>`<div class="mb-2 rounded-lg border border-dashed p-3"><label class="text-sm font-semibold">${esc(r)} *</label><input type="file" accept=".pdf,.jpg,.jpeg,.png" class="mt-1 block text-sm" onchange="V.d.f=V.d.f||{};V.d.f[${i}]=this.files[0]?.name||''"> ${d.f&&d.f[i]?`<span class="text-xs text-green-600">${esc(d.f[i])}</span>`:''}</div>`).join('')}</div>`;
  if(s==4)b=`<div class="${CARD}"><h3 class="mb-3 font-bold">4. Konfirmasi</h3><dl class="grid grid-cols-[120px_1fr] gap-1 text-sm"><dt class="text-slate-500">Layanan</dt><dd>${esc(ly.n)}</dd><dt class="text-slate-500">Nama</dt><dd>${esc(d.nama)}</dd><dt class="text-slate-500">Telepon</dt><dd>${esc(d.hp)}</dd><dt class="text-slate-500">Alamat</dt><dd>${esc(d.alamat)}</dd>${ly.req.map((r,i)=>`<dt class="text-slate-500">${esc(r)}</dt><dd>${esc(d.f[i])}</dd>`).join('')}</dl><label class="mt-4 flex gap-2 text-sm"><input type="checkbox" id="ok"> Saya menyatakan data dan dokumen yang saya kirim adalah benar.</label></div>`;
  return shell('Ajukan Permohonan','Pilih jenis layanan dan lengkapi formulir permohonan',head+b+`<div class="mt-4 flex justify-end gap-2">${s>1?`<button class="${B2}" onclick="V.step--;R()">Kembali</button>`:''}<button class="${B1}" onclick="nextStep()">${s==4?'<i class="fa-solid fa-paper-plane"></i> Kirim Permohonan':'Selanjutnya'}</button></div>`)}
function nextStep(){const s=V.step,d=V.d,er=m=>toast(m,'er');
  if(s==1){if(!d.lid)return er('Pilih jenis layanan terlebih dahulu.')}
  if(s==2){d.nama=a1.value.trim();d.hp=a2.value.trim();d.alamat=a3.value.trim();if(d.nama.length<3)return er('Nama minimal 3 karakter.');if(!/^[0-9+\s-]{8,20}$/.test(d.hp))return er('Nomor telepon tidak valid.');if(d.alamat.length<5)return er('Alamat minimal 5 karakter.')}
  if(s==3){const l=LY(d.lid);for(let i=0;i<l.req.length;i++){const n=(d.f||{})[i];if(!n)return er('Dokumen "'+l.req[i]+'" wajib diunggah.');if(!/\.(pdf|jpe?g|png)$/i.test(n))return er('Tipe file harus PDF, JPG, atau PNG.')}}
  if(s==4){if(!ok.checked)return er('Anda harus menyatakan data yang dikirim benar.');
    const l=LY(d.lid),id=D.M.length+1,tg=iso(T);D.M.push({id,no:'SIPAK-'+tg.replace(/-/g,'')+'-'+String(id+100).padStart(6,'0'),uid:V.me.id,nama:d.nama,hp:d.hp,alamat:d.alamat,lid:l.id,tgl:tg,selesai:'',status:'diajukan',catatan:'',petugas:0,docs:l.req.map((n,i)=>({n,file:d.f[i],st:'menunggu',cat:''})),riw:[{st:'diajukan',cat:'Permohonan diajukan oleh pemohon.',t:now(),by:'Pemohon'}]});
    notif(V.me.id,id,'Permohonan berhasil dikirim','Permohonan Anda telah diterima dengan nomor '+D.M[id-1].no+'.');save();toast('Permohonan berhasil dikirim.');return go('detail',id)}
  V.step++;R()}

/* ---------- Notifikasi, pengguna, layanan, laporan ---------- */
function notifPg(){const L=D.N.filter(n=>n.uid==V.me.id);const ic={sukses:['green','circle-check'],peringatan:['orange','triangle-exclamation'],gagal:['red','circle-xmark'],info:['blue','circle-info']};
  return shell('Notifikasi','Pemberitahuan tentang permohonan Anda',`<div class="${CARD}"><div class="mb-2 text-right"><button class="${B2}" onclick="D.N.forEach(n=>n.uid==V.me.id&&(n.baca=1));save();R()">Tandai semua dibaca</button></div>${L.length?L.map(n=>`<a class="flex gap-3 border-b py-3 last:border-0 ${n.baca?'':'-mx-4 bg-blue-50/60 px-4'}" onclick="go('detail',${n.mid})"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-lg bg-${ic[n.j][0]}-100 text-${ic[n.j][0]}-600"><i class="fa-solid fa-${ic[n.j][1]}"></i></span><div class="flex-1"><div class="flex justify-between"><b class="text-sm">${esc(n.judul)}</b><span class="text-xs text-slate-400">${n.t.slice(11)}</span></div><div class="text-sm text-slate-600">${esc(n.pesan)}</div></div></a>`).join(''):'<p class="py-8 text-center text-slate-400">Belum ada notifikasi.</p>'}</div>`)}
function pengguna(){const L=D.U.filter(u=>(!V.q||(u.nama+u.email).toLowerCase().includes(V.q.toLowerCase()))&&(!V.fs||u.role==V.fs));
  return shell('Kelola Pengguna','Tambah, edit dan kelola akun pengguna',`<div class="${CARD}"><div class="mb-3 flex flex-wrap gap-2"><input class="in min-w-48 flex-[3]" placeholder="Cari nama atau email..." value="${esc(V.q)}" onchange="V.q=this.value;R()"><select class="in flex-1" onchange="V.fs=this.value;R()"><option value="">Semua Peran</option>${['admin','petugas','masyarakat'].map(r=>`<option ${V.fs==r?'selected':''}>${r}</option>`).join('')}</select><button class="${B1}" onclick="addUser()"><i class="fa-solid fa-plus"></i> Tambah Pengguna</button></div>
  <div class="overflow-x-auto"><table class="w-full min-w-[560px]"><thead><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${L.map(u=>`<tr><td><b>${esc(u.nama)}</b></td><td>${esc(u.email)}</td><td class="capitalize">${u.role}</td><td>${u.aktif?'<span class="bd bg-green-100 text-green-700">Aktif</span>':'<span class="bd bg-red-100 text-red-700">Nonaktif</span>'}</td><td>${u.id==V.me.id?'<span class="text-xs text-slate-400">Anda</span>':`<button class="rounded-md border px-3 py-1 text-xs font-semibold" onclick="D.U.find(x=>x.id==${u.id}).aktif^=1;save();R()">${u.aktif?'Nonaktifkan':'Aktifkan'}</button>`}</td></tr>`).join('')}</tbody></table></div></div>`)}
function addUser(){const n=(prompt('Nama petugas baru:')||'').trim(),e=(prompt('Email petugas:')||'').trim().toLowerCase();
  if(n.length<3||!/^\S+@\S+\.\S+$/.test(e))return toast('Nama (min. 3) dan email valid wajib diisi.','er');if(D.U.some(u=>u.email==e))return toast('Email sudah digunakan.','er');
  D.U.push({id:D.U.length+1,nama:n,email:e,role:'petugas',aktif:1,hp:'-'});save();toast('Akun petugas ditambahkan (password demo: demo123).');R()}
function layananPg(){return shell('Jenis Layanan','Kelola layanan, persyaratan, dan estimasi waktu',`<div class="${CARD}"><div class="overflow-x-auto"><table class="w-full min-w-[560px]"><thead><tr><th>Nama Layanan</th><th>Estimasi</th><th>Persyaratan</th><th>Permohonan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${D.LY.map(l=>`<tr><td><b>${esc(l.n)}</b></td><td>${l.hari} hari kerja</td><td>${l.req.length} dokumen</td><td>${D.M.filter(m=>m.lid==l.id).length}</td><td>${l.aktif?'<span class="bd bg-green-100 text-green-700">Aktif</span>':'<span class="bd bg-slate-200 text-slate-600">Nonaktif</span>'}</td><td><button class="rounded-md border px-3 py-1 text-xs font-semibold" onclick="D.LY.find(x=>x.id==${l.id}).aktif^=1;save();R()">${l.aktif?'Nonaktifkan':'Aktifkan'}</button></td></tr>`).join('')}</tbody></table></div><p class="mt-2 text-xs text-slate-500">Layanan tidak dihapus agar riwayat tetap utuh.</p></div>`)}
function laporan(){const L=D.M.filter(m=>m.tgl>=V.dari&&m.tgl<=V.sampai&&(!V.ml||m.lid==V.ml)).sort(byNew);
  return shell('Laporan Permohonan','Laporan dan statistik pelayanan',`<div class="${CARD} mb-4"><div class="flex flex-wrap items-end gap-2"><div><label class="text-xs font-semibold">Tanggal Mulai</label><input type="date" class="in" value="${V.dari}" onchange="V.dari=this.value;R()"></div><div><label class="text-xs font-semibold">Tanggal Akhir</label><input type="date" class="in" value="${V.sampai}" onchange="V.sampai=this.value;R()"></div><div class="min-w-48 flex-1"><label class="text-xs font-semibold">Jenis Layanan</label><select class="in" onchange="V.ml=+this.value;R()"><option value="0">Semua</option>${D.LY.map(l=>`<option value="${l.id}" ${V.ml==l.id?'selected':''}>${esc(l.n)}</option>`).join('')}</select></div></div></div>
  <div class="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4">${card('Total Permohonan',L.length,'file-lines')}${card('Selesai',cnt(L,'selesai'),'circle-check','g')}${card('Diproses',cnt(L,['diverifikasi','diproses']),'gears')}${card('Ditolak',cnt(L,'ditolak'),'circle-xmark','r')}</div>
  <div class="${CARD}"><h3 class="mb-3 font-bold">Data Permohonan</h3>${table(L.slice(0,50))}<div class="np mt-4 flex justify-end gap-2"><button class="rounded-lg bg-green-600 px-4 py-2 text-sm font-semibold text-white" onclick="csv()"><i class="fa-solid fa-file-csv"></i> Export CSV</button><button class="${B1}" onclick="print()"><i class="fa-solid fa-print"></i> Cetak PDF</button></div><p class="mt-2 text-xs text-slate-400">Cetakan demo ini bukan dokumen resmi.</p></div>`)}
function csv(){const L=D.M.filter(m=>m.tgl>=V.dari&&m.tgl<=V.sampai&&(!V.ml||m.lid==V.ml)),c=v=>'"'+(/^[=+\-@]/.test(String(v))?"'":'')+String(v).replace(/"/g,'""')+'"';
  const t='\ufeff'+['No. Permohonan,Nama,Layanan,Tanggal,Status,Tanggal Selesai'].concat(L.map(m=>[m.no,m.nama,LY(m.lid).n,m.tgl,ST[m.status][0],m.selesai].map(c).join(','))).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='laporan-sipak.csv';a.click()}

/* ---------- Router ---------- */
function R(){const me=V.me;if(!me){$('#app').innerHTML=login();return}
  const P={dash,daftar,detail,ajukan,notif:notifPg,pengguna,layanan:layananPg,laporan}, ok=MENU[me.role].some(m=>m[0]==V.pg)||V.pg=='detail';
  $('#app').innerHTML=(ok?P[V.pg]:dash)();}
R();
</script>
</body>
</html>
